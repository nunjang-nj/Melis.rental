<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็คคิวกล้อง</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2a2326;--mut:#8a7f84;--pk:#d9569a;--ln:#eee6e8;--ok:#e6f4ea;--okt:#2e7d4a;--bad:#fde8ec;--badt:#c0345a}
@media(prefers-color-scheme:dark){:root{--bg:#1b1719;--card:#262022;--tx:#f3eced;--mut:#a79ca1;--ln:#3a3236;--ok:#1f3a2a;--okt:#7fd69f;--bad:#43202b;--badt:#ff8fae}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:16px}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
.pill{padding:6px 12px;border-radius:99px;font-size:13px;background:var(--ok);color:var(--okt);white-space:nowrap}
.pill.b{background:var(--bad);color:var(--badt)}
.btn{border:0;background:#06c755;color:#fff;padding:10px 16px;border-radius:12px;font:inherit;cursor:pointer;display:inline-block;text-decoration:none}
input{width:100%;padding:10px;border:1px solid var(--ln);border-radius:12px;font:inherit;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--badt);font-size:14px;margin:8px 0}
</style></head><body><div class="w">
<h1>📷 เช็คคิวกล้อง</h1>
<div class="mut" style="margin-bottom:12px">เลือกวันรับ–วันคืน เพื่อดูว่ากล้องรุ่นไหนว่างหรือไม่ว่าง</div>

<div class="card">
  <div class="g2"><div><label>วันรับ</label><input type="date" id="s"></div><div><label>วันคืน</label><input type="date" id="e"></div></div>
  <div class="mut" id="sum"></div>
</div>
<div class="card" id="list"><div class="mut">กำลังโหลด...</div></div>
<div id="ln" style="text-align:center"></div>
</div>

<script>
/* ===== ตั้งค่าร้าน ===== */
const CFG={
  API:"https://script.google.com/macros/s/AKfycbwDbF1wRSvKKE8UD7Vv_KED7Y9_J2_d2bT_7_E4XUplp0eYPqdSgkh6T0zAW0haVQgz/exec",
  LINE:"@198tvifo"
};
/* ====================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const fd=s=>new Date(s+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
const nDays=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const hit=(L,pid,s,e)=>L.some(r=>r.pid==pid&&r.start<=e&&s<=r.end);
let D=null;

async function load(){
  try{
    const r=await fetch(CFG.API+"?mode=queue");
    D=await r.json();
    if(!D.products)throw 0;
    draw();
  }catch(x){$("list").innerHTML='<div class="err">โหลดข้อมูลไม่สำเร็จ กรุณาลองรีเฟรชหน้านี้</div>'}
}
function draw(){
  if(!D)return;
  const s=$("s").value,e=$("e").value;
  if(!s||!e||e<s){$("sum").textContent="กรุณาเลือกวันที่ให้ถูกต้อง (วันคืนต้องไม่ก่อนวันรับ)";$("list").innerHTML="";return}
  $("sum").textContent=fd(s)+" – "+fd(e)+" ("+nDays(s,e)+" วัน)";
  $("list").innerHTML=D.products.map(p=>{
    const bk=hit(D.booked,p.id,s,e);
    return '<div class="row"><b>'+esc(p.name)+'</b>'+(bk?'<span class="pill b">ไม่ว่าง</span>':'<span class="pill">ว่าง</span>')+'</div>';
  }).join("")||'<div class="mut">ยังไม่มีสินค้า</div>';
}

if(CFG.LINE){
  $("ln").innerHTML='<div class="mut" style="margin-bottom:8px">สนใจเช่า ติดต่อร้านทาง LINE ได้เลย</div><a class="btn" href="https://line.me/R/ti/p/'+encodeURIComponent(CFG.LINE)+'" target="_blank" rel="noopener">แอด LINE ร้าน '+esc(CFG.LINE)+'</a>';
}
$("s").min=$("e").min=today();
$("s").value=$("e").value=today();
$("s").onchange=()=>{if($("e").value<$("s").value)$("e").value=$("s").value;draw()};
$("e").onchange=draw;
load();
</script></body></html>
