<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็คคิวและจองกล้อง</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2a2326;--mut:#8a7f84;--pk:#d9569a;--ln:#eee6e8;--ok:#e6f4ea;--okt:#2e7d4a;--bad:#fde8ec;--badt:#c0345a;--wn:#fff4d6;--wnt:#8a6100}
@media(prefers-color-scheme:dark){:root{--bg:#1b1719;--card:#262022;--tx:#f3eced;--mut:#a79ca1;--ln:#3a3236;--ok:#1f3a2a;--okt:#7fd69f;--bad:#43202b;--badt:#ff8fae;--wn:#3d3217;--wnt:#f2cf6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-size:16px}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
.pill{padding:6px 12px;border-radius:99px;font-size:13px;background:var(--ok);color:var(--okt);white-space:nowrap}
.pill.b{background:var(--bad);color:var(--badt)}
.pill.w{background:var(--wn);color:var(--wnt)}
.btn{border:0;background:var(--pk);color:#fff;padding:10px 16px;border-radius:12px;font:inherit;cursor:pointer}
.btn.g{background:var(--ln);color:var(--tx)}
.btn.s{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:12px;font:inherit;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:20px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:flex-end;justify-content:center;padding:12px;overflow:auto}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;margin:0}
.pay{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;margin:6px 0}
.hp{position:absolute;left:-9999px;opacity:0}
.err{color:var(--badt);font-size:14px;margin:8px 0}
</style></head><body><div class="w">
<h1>📷 เช็คคิวและจองกล้อง</h1>
<div class="mut" style="margin-bottom:12px">เลือกวันรับ–วันคืน เพื่อดูว่ากล้องรุ่นไหนว่าง แล้วกด "ขอจอง" ร้านจะตรวจสลิปและยืนยันให้อีกครั้ง</div>

<div class="card">
  <div class="g2"><div><label>วันรับ</label><input type="date" id="s"></div><div><label>วันคืน</label><input type="date" id="e"></div></div>
  <div class="mut" id="sum"></div>
</div>
<div class="card" id="list"><div class="mut">กำลังโหลด...</div></div>
<div class="mut" style="text-align:center">ป้ายเหลือง "รออนุมัติ" = มีลูกค้าขอจองช่วงนี้แล้ว รอร้านยืนยัน</div>
</div>

<script>
/* ===== ตั้งค่าร้าน (แก้ตรงนี้) ===== */
const CFG={
  API:"https://script.google.com/macros/s/AKfycbwDbF1wRSvKKE8UD7Vv_KED7Y9_J2_d2bT_7_E4XUplp0eYPqdSgkh6T0zAW0haVQgz/exec",
  PAY:[
    {label:"PromptPay",value:"ใส่เบอร์พร้อมเพย์ที่นี่",name:"ชื่อบัญชี"},
    {label:"โอนผ่านบัญชีธนาคาร",value:"ใส่เลขบัญชีที่นี่",name:"ชื่อธนาคาร / ชื่อบัญชี"}
  ]
};
/* ================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const money=n=>"฿"+Number(n||0).toLocaleString("th-TH");
const fd=s=>new Date(s+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
const nDays=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
function tot(p,n){
  const b=+p.price||0,o=p.promo;
  if(!o||n<2)return n*b;
  const t={2:o.d2,3:o.d3,4:o.d4};
  if(n<=4)return t[n]>0?t[n]:n*b;
  const base=o.d4>0?o.d4:4*b;
  return base+(n-4)*(o.ex>0?o.ex:b);
}
const hit=(L,pid,s,e)=>L.some(r=>r.pid==pid&&r.start<=e&&s<=r.end);
let D=null,slip=null;

async function load(){
  try{
    const r=await fetch(CFG.API+"?mode=queue");
    D=await r.json();
    if(!D.products)throw 0;
    draw();
  }catch(x){$("list").innerHTML='<div class="err">โหลดข้อมูลไม่สำเร็จ กรุณาลองรีเฟรชหน้านี้</div>'}
}
function range(){
  const s=$("s").value,e=$("e").value;
  if(!s||!e||e<s)return null;
  return [s,e];
}
function draw(){
  if(!D)return;
  const R=range();
  if(!R){$("sum").textContent="กรุณาเลือกวันที่ให้ถูกต้อง (วันคืนต้องไม่ก่อนวันรับ)";$("list").innerHTML="";return}
  const [s,e]=R,n=nDays(s,e);
  $("sum").textContent=fd(s)+" – "+fd(e)+" ("+n+" วัน)";
  $("list").innerHTML=D.products.map(p=>{
    const bk=hit(D.booked,p.id,s,e),pd=!bk&&hit(D.pending,p.id,s,e);
    const st=bk?'<span class="pill b">ไม่ว่าง</span>':pd?'<span class="pill w">รออนุมัติ</span>':'<span class="pill">ว่าง</span>';
    const act=bk?"":'<button class="btn s" data-p="'+p.id+'">ขอจอง</button>';
    return '<div class="row"><div><b>'+esc(p.name)+'</b><div class="mut">ราคาช่วงนี้ '+money(tot(p,n))+'</div></div><div style="display:flex;gap:8px;align-items:center">'+st+act+'</div></div>';
  }).join("")||'<div class="mut">ยังไม่มีสินค้า</div>';
  $("list").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>form(+b.dataset.p));
}

/* ----- ฟอร์มขอจอง ----- */
function copyBtn(v){return '<button class="btn g s" type="button" data-cp="'+esc(v)+'">คัดลอก</button>'}
function form(pid){
  const R=range();if(!R)return;
  const [s,e]=R,n=nDays(s,e),p=D.products.find(x=>x.id==pid);if(!p)return;
  const rent=tot(p,n),dep=+D.deposit||0,pd=hit(D.pending,pid,s,e);
  slip=null;
  const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML='<div class="card sheet">'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">ขอจอง '+esc(p.name)+'</b><button class="btn g s" id="x">ปิด ✕</button></div>'
    +'<div class="mut">'+fd(s)+' – '+fd(e)+' ('+n+' วัน)</div>'
    +(pd?'<div class="pill w" style="display:block;white-space:normal;margin:8px 0">ช่วงนี้มีลูกค้าขอจองไว้แล้ว รอร้านยืนยัน หากคิวแรกไม่ผ่าน ร้านจะติดต่อกลับ</div>':"")
    +'<div class="pay"><div style="display:flex;justify-content:space-between"><span>ค่าเช่า</span><b>'+money(rent)+'</b></div><div style="display:flex;justify-content:space-between"><span>ค่ามัดจำ</span><b>'+money(dep)+'</b></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--ln);margin-top:6px;padding-top:6px"><span>ยอดที่ต้องโอน</span><b class="big">'+money(rent+dep)+'</b></div></div>'
    +'<label>ชื่อผู้เช่า</label><input id="fn" autocomplete="name">'
    +'<label>เบอร์โทร หรือ LINE ID</label><input id="fc">'
    +'<label>การรับกล้อง</label><select id="fm"><option value="0">มารับเอง</option><option value="1">ส่งโดย Messenger</option><option value="2">ส่งพัสดุ</option></select>'
    +'<div id="fa" style="display:none"><label>ที่อยู่จัดส่ง / เบอร์ผู้รับ</label><textarea id="fad" rows="2"></textarea><label>ลิงก์ Google Maps (ถ้ามี)</label><input id="fmp" placeholder="วางลิงก์ที่นี่"><div class="mut" style="margin-bottom:8px">ค่าจัดส่ง (ถ้ามี) ร้านจะแจ้งเพิ่มทางแชท</div></div>'
    +'<label>หมายเหตุ (ถ้ามี)</label><input id="fno">'
    +'<div style="margin:6px 0"><b>โอนเงินที่</b>'+CFG.PAY.map(x=>'<div class="pay"><div class="mut">'+esc(x.label)+'</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+esc(x.value)+'</b>'+copyBtn(x.value)+'</div><div class="mut">'+esc(x.name)+'</div></div>').join("")+'</div>'
    +'<label>แนบสลิปโอนเงิน</label><input type="file" id="fs" accept="image/*"><img id="pv" alt="" style="display:none;max-width:140px;border-radius:10px;margin-bottom:8px">'
    +'<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">'
    +'<div class="err" id="er" style="display:none"></div>'
    +'<button class="btn" id="go" style="width:100%">ส่งคำขอจอง</button>'
    +'<div class="mut" style="margin-top:8px">ส่งคำขอแล้วคิวจะยังไม่ล็อกจนกว่าร้านจะตรวจสลิปและยืนยัน</div></div>';
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onclick=ev=>{if(ev.target===ov)close()};
  $("x").onclick=close;
  $("fm").onchange=()=>{$("fa").style.display=+$("fm").value?"block":"none"};
  ov.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.cp);b.textContent="คัดลอกแล้ว"}catch(x){}});
  $("fs").onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;
    try{slip=await shrink(f);$("pv").src="data:"+slip.mime+";base64,"+slip.data;$("pv").style.display="block"}
    catch(x){slip=null;showErr("อ่านรูปสลิปไม่ได้ กรุณาลองรูปอื่น")}
  };
  const showErr=m=>{$("er").textContent=m;$("er").style.display="block"};
  $("go").onclick=async()=>{
    $("er").style.display="none";
    const name=$("fn").value.trim(),contact=$("fc").value.trim(),ship=+$("fm").value,addr=$("fad").value.trim();
    if(!name||!contact)return showErr("กรุณากรอกชื่อและเบอร์โทร/LINE");
    if(ship&&!addr)return showErr("กรุณากรอกที่อยู่จัดส่ง");
    if(!slip)return showErr("กรุณาแนบสลิปโอนเงิน");
    $("go").disabled=true;$("go").textContent="กำลังส่ง...";
    try{
      const r=await fetch(CFG.API+"?mode=request",{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({
        pid,start:s,end:e,name,contact,ship,addr,map:ship?$("fmp").value.trim():"",note:$("fno").value.trim(),website:$("hp").value,slip})});
      const j=await r.json();
      if(j.ok){
        ov.querySelector(".sheet").innerHTML='<div class="big" style="margin:8px 0">✅ ส่งคำขอจองแล้ว</div><div>ร้านจะตรวจสลิปและติดต่อกลับทาง '+esc(contact)+' เพื่อยืนยันคิว</div><div class="mut" style="margin:8px 0">เลขอ้างอิง: '+esc(j.id||"")+'</div><button class="btn" id="ok" style="width:100%;margin-top:8px">ตกลง</button>';
        $("ok").onclick=()=>{close();load()};
      }else{showErr(j.error||"ส่งไม่สำเร็จ กรุณาลองใหม่");$("go").disabled=false;$("go").textContent="ส่งคำขอจอง"}
    }catch(x){showErr("ส่งไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่");$("go").disabled=false;$("go").textContent="ส่งคำขอจอง"}
  };
}

/* ย่อรูปสลิปก่อนส่ง */
function shrink(file){
  return new Promise((ok,no)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const m=1100,k=Math.min(1,m/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      ok({mime:"image/jpeg",data:c.toDataURL("image/jpeg",.72).split(",")[1]});
    };
    im.onerror=()=>{URL.revokeObjectURL(u);no()};
    im.src=u;
  });
}

const t=new Date();
$("s").min=$("e").min=today();
$("s").value=$("e").value=today();
$("s").onchange=()=>{if($("e").value<$("s").value)$("e").value=$("s").value;draw()};
$("e").onchange=draw;
load();
</script></body></html>
